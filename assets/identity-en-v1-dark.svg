<svg xmlns="http://www.w3.org/2000/svg" width="880" height="172" viewBox="0 0 880 172" role="img" aria-labelledby="heading description"><title id="heading">Hi, I'm Vanya</title><desc id="description">I spent 14 years writing code, five of them at Yandex. These days I work on my own projects, from a digital campfire for facilitated group conversations to an AI agent harness.</desc>
<style>
@keyframes ink-appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes accent-draw{from{stroke-dashoffset:112}to{stroke-dashoffset:0}}
.headline{animation:ink-appear .8s ease-out both}
.intro{animation:ink-appear .8s ease-out .16s both}
.accent-line{stroke-dasharray:112;animation:accent-draw 1s ease-out .34s both}
@media(prefers-reduced-motion:reduce){.headline,.intro,.accent-line{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
</style>
<rect width="880" height="172" fill="#1E1C1A"/>
<g class="headline" font-family="Manrope,Arial,sans-serif"><text x="24" y="90" font-size="45" font-weight="600" fill="#ECE4D6">Hi, I'm Vanya</text></g>
<path class="accent-line" d="M 25 109 H 137" stroke="#E5A476" stroke-width="2" stroke-opacity=".56" fill="none" stroke-linecap="round"/>
<path d="M 420 28 V 142" stroke="#504940" stroke-width="1"/>
<g class="intro" font-family="Manrope,Arial,sans-serif" font-size="16.4" font-weight="400" fill="#B8AC9F"><text x="447" y="33">I spent 14 years writing code,</text><text x="447" y="57">five of them at Yandex.</text><text x="447" y="81">These days I work on my own projects,</text><text x="447" y="105">from a digital campfire for facilitated</text><text x="447" y="129">group conversations to an AI agent harness.</text></g>
<path d="M 24 156 H 856" stroke="#504940" stroke-width="1" fill="none"/>
</svg>