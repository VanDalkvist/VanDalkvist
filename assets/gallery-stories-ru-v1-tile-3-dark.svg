<svg xmlns="http://www.w3.org/2000/svg" width="220" height="211" viewBox="0 0 220 211"><title>Мужик Кирилл — История в подарок другу</title><style>@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}@keyframes softly{0%,100%{opacity:.75}50%{opacity:1}}.t{animation:appear .7s ease-out 0.36s both}.m{stroke-dasharray:520;animation:draw 1.65s cubic-bezier(.2,.6,.2,1) 0.36s both}.p{animation:softly 1.8s ease-in-out 1.86s 2 both}@media(prefers-reduced-motion:reduce){.t,.m,.p{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}</style><rect width="220" height="211" fill="#1E1C1A"/><g class="t" font-family="Manrope,Arial,sans-serif" fill="#ECE4D6"><text x="18" y="37" font-size="20" font-weight="600">Мужик Кирилл</text></g><g transform="translate(13 48)" class="p"><g class="m" color="#E5A476" stroke="#E5A476" stroke-width="1.8" stroke-opacity=".82" fill="none" stroke-linejoin="round" stroke-linecap="round"><rect x="61" y="39" width="65" height="49" rx="3" transform="rotate(-9 93 64)"/><rect x="83" y="34" width="68" height="51" rx="3" transform="rotate(7 117 59)"/><path d="M93 51 H132 M93 61 H122"/></g></g><text x="18" y="195" font-family="Manrope,Arial,sans-serif" font-size="11.8" fill="#B8AC9F">История в подарок другу</text></svg>