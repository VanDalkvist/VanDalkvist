<svg xmlns="http://www.w3.org/2000/svg" width="220" height="270" viewBox="0 0 220 270"><title>IOC Film — Architecture as film</title><style>@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes trace{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}.txt{animation:appear .65s ease-out both}.art{stroke-dasharray:600;animation:trace 1.65s ease-out .35s both}@media(prefers-reduced-motion:reduce){.txt,.art{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}</style><rect width="220" height="270" fill="#F6F5F0"/><g font-family="Manrope,Arial,sans-serif"><text class="txt" x="26" y="59" font-size="20" font-weight="600" fill="#29231D">IOC Film</text></g><path d="M178 44 L199 23 M187 23 H199 V35" stroke="#685F54" stroke-opacity=".64" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><g transform="translate(26 112)" stroke="#B65A34" color="#B65A34" stroke-opacity=".67" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><g class="art"><rect x="0" y="19" width="42" height="37" rx="3"/><rect x="111" y="19" width="42" height="37" rx="3"/><path d="M44 37 H108 M101 31 L109 37 L101 43 M69 18 V0 H131 V18"/></g></g><text x="26" y="246" font-family="Manrope,Arial,sans-serif" font-size="11.4" fill="#685F54">Architecture as film</text></svg>