<svg xmlns="http://www.w3.org/2000/svg" width="220" height="292" viewBox="0 0 220 292" role="img" aria-label="Arch Rules"><title>Arch Rules — Architecture rules for AI</title><style>@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}@keyframes softly{0%,100%{opacity:.77}50%{opacity:1}}.t{animation:appear .7s ease-out 0.36s both}.m{stroke-dasharray:520;animation:draw 1.65s cubic-bezier(.2,.6,.2,1) 0.36s both}.p{animation:softly 1.8s ease-in-out 1.86s 2 both}@media(prefers-reduced-motion:reduce){.t,.m,.p{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}</style><rect width="220" height="292" fill="#F6F5F0"/><g transform="translate(-440 0)"><text class="t" x="22" y="50" fill="#28231D" font-family="Manrope,Arial,sans-serif" font-size="30" font-weight="600">Agent pipelines</text><path d="M22 68 H858" stroke="#D4CABD" stroke-width="1"/></g><g transform="translate(0 81)"><g class="t" font-family="Manrope,Arial,sans-serif" fill="#28231D"><text x="18" y="36" font-size="20" font-weight="600">Arch Rules</text></g><g transform="translate(13 48)" class="p"><g class="m" color="#B65A34" stroke="#B65A34" stroke-width="1.8" stroke-opacity=".82" fill="none" stroke-linejoin="round" stroke-linecap="round"><rect x="44" y="31" width="114" height="83" rx="4"/><path d="M59 51 H145 M59 72 H145 M59 93 H145"/><path d="M61 46 L67 52 L76 39 M61 67 L67 73 L76 60"/></g></g><text x="18" y="195" font-family="Manrope,Arial,sans-serif" font-size="11.8" fill="#6F665B">Architecture rules for AI</text></g></svg>