<svg xmlns="http://www.w3.org/2000/svg" width="220" height="270" viewBox="0 0 220 270"><title>Vanya UI — Дизайн-система проектов</title><style>@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes trace{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}.txt{animation:appear .65s ease-out both}.art{stroke-dasharray:600;animation:trace 1.65s ease-out .35s both}@media(prefers-reduced-motion:reduce){.txt,.art{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}</style><rect width="220" height="270" fill="#1E1C1A"/><g font-family="Manrope,Arial,sans-serif"><text class="txt" x="26" y="59" font-size="20" font-weight="600" fill="#ECE4D6">Vanya UI</text></g><path d="M178 44 L199 23 M187 23 H199 V35" stroke="#B8AC9F" stroke-opacity=".64" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><g transform="translate(26 112)" stroke="#E5A476" color="#E5A476" stroke-opacity=".67" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><g class="art"><rect x="0" y="0" width="144" height="91" rx="4"/><path d="M0 21 H144"/><circle cx="12" cy="11" r="3"/><circle cx="24" cy="11" r="3"/><rect x="16" y="35" width="63" height="31" rx="4"/><circle cx="113" cy="53" r="12"/></g></g><text x="26" y="246" font-family="Manrope,Arial,sans-serif" font-size="11.4" fill="#B8AC9F">Дизайн-система проектов</text></svg>