<svg xmlns="http://www.w3.org/2000/svg" width="440" height="350" viewBox="0 0 440 350" role="img"><title>Агентские пайплайны — scene one</title><style>@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes jump{0%{transform:translate(-150px,22px)}45%{transform:translate(-72px,-56px)}100%{transform:none}}@keyframes scaleX{from{transform:scaleX(.05)}to{transform:scaleX(1)}}.stage{animation:rise .65s ease-out both}.s1{animation-delay:.18s}.s2{animation-delay:.75s}.s3{animation-delay:1.32s}.s4{animation-delay:1.95s}.jumper{animation:jump 1.5s cubic-bezier(.3,.15,.3,1) .55s both}.build-progress{transform-origin:left center;animation:scaleX 1.3s ease-out 1.3s both}@media(prefers-reduced-motion:reduce){.stage,.jumper,.build-progress{animation:none!important;opacity:1!important;transform:none!important}}</style><rect width="440" height="350" fill="#1E1C1A"/><g transform="translate(-440 0)" fill="#ECE4D6" font-family="Manrope,Arial,sans-serif"><text x="26" y="65" font-size="31" font-weight="500">Агентские пайплайны</text><path d="M26 90 H854" stroke="#504940" stroke-width=".85"/></g><g fill="none" stroke="#E5A476" color="#E5A476" stroke-opacity=".63" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><g class="stage s1"><rect x="29" y="156" width="92" height="91" rx="5"/><path d="M43 174 H105 M43 187 H94 M43 201 H103"/><path d="M121 198 H165 M157 192 L165 198 L157 204"/></g>
