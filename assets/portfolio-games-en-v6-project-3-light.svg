<svg xmlns="http://www.w3.org/2000/svg" width="220" height="270" viewBox="0 0 220 270"><title>AI World — Agents build a megaproject</title><style>@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes trace{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}.txt{animation:appear .65s ease-out both}.art{stroke-dasharray:600;animation:trace 1.65s ease-out .35s both}@media(prefers-reduced-motion:reduce){.txt,.art{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}</style><rect width="220" height="270" fill="#F6F5F0"/><g font-family="Manrope,Arial,sans-serif"><text class="txt" x="26" y="59" font-size="20" font-weight="600" fill="#29231D">AI World</text></g><path d="M184 39 H200 V23 M188 35 L200 23" stroke="#685F54" stroke-opacity=".55" stroke-width="1.05" fill="none"/><g transform="translate(26 112)" stroke="#B65A34" color="#B65A34" stroke-opacity=".67" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><g class="art"><path d="M0 68 L70 16 L142 70 M17 80 H129 M42 80 V57 H96 V80"/><circle cx="70" cy="16" r="8"/><circle cx="15" cy="77" r="7"/><circle cx="126" cy="77" r="7"/><path d="M70 25 V48 M65 42 L70 49 L75 42"/></g></g><text x="26" y="246" font-family="Manrope,Arial,sans-serif" font-size="11.4" fill="#685F54">Agents build a megaproject</text></svg>