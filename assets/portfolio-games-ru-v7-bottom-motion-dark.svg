<svg xmlns="http://www.w3.org/2000/svg" width="440" height="270" viewBox="0 0 440 270" role="img"><title>Игровые механики — scene two</title><style>@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes jump{0%{transform:translate(-150px,22px)}45%{transform:translate(-72px,-56px)}100%{transform:none}}@keyframes scaleX{from{transform:scaleX(.05)}to{transform:scaleX(1)}}.stage{animation:rise .65s ease-out both}.s1{animation-delay:.18s}.s2{animation-delay:.75s}.s3{animation-delay:1.32s}.s4{animation-delay:1.95s}.jumper{animation:jump 1.5s cubic-bezier(.3,.15,.3,1) .55s both}.build-progress{transform-origin:left center;animation:scaleX 1.3s ease-out 1.3s both}@media(prefers-reduced-motion:reduce){.stage,.jumper,.build-progress{animation:none!important;opacity:1!important;transform:none!important}}</style><rect width="440" height="270" fill="#1E1C1A"/><g fill="none" stroke="#E5A476" color="#E5A476" stroke-opacity=".63" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><g class="stage s1"><circle cx="62" cy="105" r="21"/><circle cx="62" cy="105" r="8"/><path d="M62 126 V159 H149"/><rect x="53" y="183" width="54" height="28" rx="5"/><circle cx="94" cy="153" r="5"/></g>
<g class="stage s2"><circle cx="174" cy="67" r="18"/><circle cx="174" cy="67" r="7"/><path d="M174 85 V123 H254 M149 159 H254"/><circle cx="254" cy="159" r="6"/><circle cx="254" cy="123" r="6"/></g>
<g class="stage s3"><path d="M291 221 V113 L355 70 L416 113 V221"/><path d="M310 210 V138 H331 V210 M359 138 H395 V171 H359Z"/><path d="M282 224 H427 M316 119 L353 94 L388 119"/><rect x="292" y="238" width="120" height="5" rx="2.5"/><rect class="build-progress" x="292" y="238" width="93" height="5" rx="2.5" fill="currentColor" stroke="none" opacity=".6"/></g></g></svg>