<svg xmlns="http://www.w3.org/2000/svg" width="220" height="211" viewBox="0 0 220 211"><title>BB References — Референсы внутри BB</title><style>@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}@keyframes softly{0%,100%{opacity:.75}50%{opacity:1}}.t{animation:appear .7s ease-out 0.36s both}.m{stroke-dasharray:520;animation:draw 1.65s cubic-bezier(.2,.6,.2,1) 0.36s both}.p{animation:softly 1.8s ease-in-out 1.86s 2 both}@media(prefers-reduced-motion:reduce){.t,.m,.p{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}</style><rect width="220" height="211" fill="#F6F5F0"/><g class="t" font-family="Manrope,Arial,sans-serif" fill="#28231D"><text x="18" y="37" font-size="20" font-weight="600">BB References</text></g><g transform="translate(13 48)" class="p"><g class="m" color="#B65A34" stroke="#B65A34" stroke-width="1.8" stroke-opacity=".82" fill="none" stroke-linejoin="round" stroke-linecap="round"><rect x="51" y="63" width="67" height="45" rx="3" transform="rotate(-8 85 86)"/><rect x="88" y="34" width="73" height="64" rx="3"/><path d="M99 82 L114 64 L130 77 L148 55"/><circle cx="109" cy="48" r="5"/></g></g><text x="18" y="195" font-family="Manrope,Arial,sans-serif" font-size="11.8" fill="#6F665B">Референсы внутри BB</text></svg>