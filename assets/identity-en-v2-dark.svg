<text x="463" y="65" font-weight="600" font-size="20" fill="#ECE4D6">15 years of coding, five at Yandex.</text>
<text x="463" y="112" font-size="17" font-weight="400" fill="#B8AC9F">These days I make interactive stories,</text><text x="463" y="140" font-size="17" font-weight="400" fill="#B8AC9F">experiment with games,</text><text x="463" y="168" font-size="17" font-weight="400" fill="#B8AC9F">and build tools for AI agents.</text>
</g>
