<svg xmlns="http://www.w3.org/2000/svg" width="880" height="258" viewBox="0 0 880 258" role="img" aria-label="Hi, I'm Vanya. 15 years of coding, five at Yandex. These days I make interactive stories, experiment with games, and build tools for AI agents."><title>Hi, I'm Vanya</title>
<style>@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes trace{from{stroke-dashoffset:430}to{stroke-dashoffset:0}}@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.85}}.hero-title{animation:enter .7s ease-out both}.hero-text{animation:enter .65s ease-out .19s both}.hero-wave{stroke-dasharray:430;animation:trace 2.2s ease-out .4s both}.hero-point{animation:breathe 2s ease-in-out 2.2s 2 both}@media(prefers-reduced-motion:reduce){.hero-title,.hero-text,.hero-wave,.hero-point{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}</style>
<rect width="880" height="258" fill="#1E1C1A"/>
<g class="hero-title" fill="#ECE4D6" font-family="Manrope,Arial,sans-serif"><text x="26" y="106" font-size="52" font-weight="500">Hi, I'm Vanya</text></g>
<path d="M432 37 V196" fill="none" stroke="#504940" stroke-width="1"/>
