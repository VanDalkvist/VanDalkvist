<svg xmlns="http://www.w3.org/2000/svg" width="440" height="270" viewBox="0 0 440 270" role="img"><title>Агентские пайплайны — scene two</title><style>@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes jump{0%{transform:translate(-150px,22px)}45%{transform:translate(-72px,-56px)}100%{transform:none}}@keyframes scaleX{from{transform:scaleX(.05)}to{transform:scaleX(1)}}.stage{animation:rise .65s ease-out both}.s1{animation-delay:.18s}.s2{animation-delay:.75s}.s3{animation-delay:1.32s}.s4{animation-delay:1.95s}.jumper{animation:jump 1.5s cubic-bezier(.3,.15,.3,1) .55s both}.build-progress{transform-origin:left center;animation:scaleX 1.3s ease-out 1.3s both}@media(prefers-reduced-motion:reduce){.stage,.jumper,.build-progress{animation:none!important;opacity:1!important;transform:none!important}}</style><rect width="440" height="270" fill="#F6F5F0"/><g fill="none" stroke="#B65A34" color="#B65A34" stroke-opacity=".63" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><g class="stage s1"><rect x="162" y="29" width="116" height="58" rx="5"/><path d="M174 47 H262 M174 59 H248"/><path d="M278 59 H328 V114 M322 104 L328 115 L334 104"/></g>
