<svg xmlns="http://www.w3.org/2000/svg" width="220" height="292" viewBox="0 0 220 292" role="img" aria-label="Ферма"><title>Ферма — Мастерская моих проектов</title><style>@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}@keyframes softly{0%,100%{opacity:.77}50%{opacity:1}}.t{animation:appear .7s ease-out 0.10s both}.m{stroke-dasharray:520;animation:draw 1.65s cubic-bezier(.2,.6,.2,1) 0.10s both}.p{animation:softly 1.8s ease-in-out 1.60s 2 both}@media(prefers-reduced-motion:reduce){.t,.m,.p{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}</style><rect width="220" height="292" fill="#1E1C1A"/><g transform="translate(0 0)"><text class="t" x="22" y="50" fill="#ECE4D6" font-family="Manrope,Arial,sans-serif" font-size="30" font-weight="600">Продукты и интерфейсы</text><path d="M22 68 H858" stroke="#453D34" stroke-width="1"/></g><g transform="translate(0 81)"><g class="t" font-family="Manrope,Arial,sans-serif" fill="#ECE4D6"><text x="18" y="36" font-size="20" font-weight="600">Ферма</text></g><g transform="translate(13 48)" class="p"><g class="m" color="#E5A476" stroke="#E5A476" stroke-width="1.8" stroke-opacity=".82" fill="none" stroke-linejoin="round" stroke-linecap="round"><rect x="44" y="37" width="48" height="34" rx="3"/><rect x="104" y="37" width="48" height="34" rx="3"/><rect x="44" y="81" width="48" height="34" rx="3"/><rect x="104" y="81" width="48" height="34" rx="3"/><path d="M54 54 H82 M114 48 H141 M114 59 H130 M55 97 H81"/></g></g><text x="18" y="195" font-family="Manrope,Arial,sans-serif" font-size="11.8" fill="#B8AC9F">Мастерская моих проектов</text></g></svg>