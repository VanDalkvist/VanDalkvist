<svg xmlns="http://www.w3.org/2000/svg" width="220" height="292" viewBox="0 0 220 292" role="img" aria-label="Город навыков"><title>Город навыков — Выборы с последствиями</title><style>@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}@keyframes softly{0%,100%{opacity:.77}50%{opacity:1}}.t{animation:appear .7s ease-out 0.49s both}.m{stroke-dasharray:520;animation:draw 1.65s cubic-bezier(.2,.6,.2,1) 0.49s both}.p{animation:softly 1.8s ease-in-out 1.99s 2 both}@media(prefers-reduced-motion:reduce){.t,.m,.p{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}</style><rect width="220" height="292" fill="#1E1C1A"/><g transform="translate(-660 0)"><text class="t" x="22" y="50" fill="#ECE4D6" font-family="Manrope,Arial,sans-serif" font-size="30" font-weight="600">Игровые механики</text><path d="M22 68 H858" stroke="#453D34" stroke-width="1"/></g><g transform="translate(0 81)"><g class="t" font-family="Manrope,Arial,sans-serif" fill="#ECE4D6"><text x="18" y="36" font-size="20" font-weight="600">Город навыков</text></g><g transform="translate(13 48)" class="p"><g class="m" color="#E5A476" stroke="#E5A476" stroke-width="1.8" stroke-opacity=".82" fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="M104 103 V71 L65 49 M104 71 L143 49 M104 71 V38"/><circle cx="65" cy="49" r="10"/><circle cx="143" cy="49" r="10"/><circle cx="104" cy="37" r="10"/></g></g><text x="18" y="195" font-family="Manrope,Arial,sans-serif" font-size="11.8" fill="#B8AC9F">Выборы с последствиями</text></g></svg>