<svg xmlns="http://www.w3.org/2000/svg" width="220" height="270" viewBox="0 0 220 270"><title>Город навыков — Выборы с последствиями</title><style>@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes trace{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}.txt{animation:appear .65s ease-out both}.art{stroke-dasharray:600;animation:trace 1.65s ease-out .35s both}@media(prefers-reduced-motion:reduce){.txt,.art{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}</style><rect width="220" height="270" fill="#1E1C1A"/><g font-family="Manrope,Arial,sans-serif"><text class="txt" x="26" y="59" font-size="20" font-weight="600" fill="#ECE4D6">Город навыков</text></g><path d="M184 39 H200 V23 M188 35 L200 23" stroke="#B8AC9F" stroke-opacity=".55" stroke-width="1.05" fill="none"/><g transform="translate(26 112)" stroke="#E5A476" color="#E5A476" stroke-opacity=".67" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><g class="art"><path d="M80 85 V50 L35 27 M80 50 L125 27 M80 50 V13"/><circle cx="35" cy="27" r="10"/><circle cx="125" cy="27" r="10"/><circle cx="80" cy="12" r="10"/></g></g><text x="26" y="246" font-family="Manrope,Arial,sans-serif" font-size="11.4" fill="#B8AC9F">Выборы с последствиями</text></svg>