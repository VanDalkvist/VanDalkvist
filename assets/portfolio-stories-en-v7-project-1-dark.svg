<svg xmlns="http://www.w3.org/2000/svg" width="220" height="350" viewBox="0 0 220 350"><title>Sine Wave — Life on a timeline</title><style>@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes trace{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}.txt{animation:appear .65s ease-out both}.art{stroke-dasharray:600;animation:trace 1.65s ease-out .35s both}@media(prefers-reduced-motion:reduce){.txt,.art{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}</style><rect width="220" height="350" fill="#1E1C1A"/><g font-family="Manrope,Arial,sans-serif"><g transform="translate(0 0)"><text x="26" y="65" font-size="31" font-weight="500" fill="#ECE4D6">Narrative and meaning</text><path d="M26 90 H854" stroke="#504940" stroke-width=".85"/></g><text class="txt" x="26" y="155" font-size="20" font-weight="600" fill="#ECE4D6">Sine Wave</text></g><path d="M178 140 L199 119 M187 119 H199 V131" stroke="#B8AC9F" stroke-opacity=".64" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><g transform="translate(26 204)" stroke="#E5A476" color="#E5A476" stroke-opacity=".67" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><g class="art"><path d="M0 43 C33 -13 52 91 87 47 S138 7 170 39"/><circle cx="88" cy="47" r="4" fill="currentColor"/></g></g><text x="26" y="327" font-family="Manrope,Arial,sans-serif" font-size="11.4" fill="#B8AC9F">Life on a timeline</text></svg>