<svg xmlns="http://www.w3.org/2000/svg" width="220" height="350" viewBox="0 0 220 350"><title>Костёр — Слова участников вокруг огня</title><style>@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes trace{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}.txt{animation:appear .65s ease-out both}.art{stroke-dasharray:600;animation:trace 1.65s ease-out .35s both}@media(prefers-reduced-motion:reduce){.txt,.art{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}</style><rect width="220" height="350" fill="#1E1C1A"/><g font-family="Manrope,Arial,sans-serif"><g transform="translate(-220 0)"><text x="26" y="65" font-size="31" font-weight="500" fill="#ECE4D6">Нарратив и смыслы</text><path d="M26 90 H854" stroke="#504940" stroke-width=".85"/></g><text class="txt" x="26" y="155" font-size="20" font-weight="600" fill="#ECE4D6">Костёр</text></g><path d="M184 135 H200 V119 M188 131 L200 119" stroke="#B8AC9F" stroke-opacity=".55" stroke-width="1.05" fill="none"/><g transform="translate(26 204)" stroke="#E5A476" color="#E5A476" stroke-opacity=".67" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><g class="art"><path d="M57 93 C38 77 50 49 65 21 C103 49 100 79 79 94Z"/><path d="M68 91 C56 72 77 63 79 47 C95 70 84 87 74 94"/><path d="M21 104 Q70 116 123 104"/></g></g><text x="26" y="327" font-family="Manrope,Arial,sans-serif" font-size="11.4" fill="#B8AC9F">Слова участников вокруг огня</text></svg>