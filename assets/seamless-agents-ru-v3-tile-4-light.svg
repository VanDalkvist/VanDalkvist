<svg xmlns="http://www.w3.org/2000/svg" width="220" height="292" viewBox="0 0 220 292" role="img" aria-label="Arch Loop"><title>Arch Loop — Ревью → план → правки</title><style>@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}@keyframes softly{0%,100%{opacity:.77}50%{opacity:1}}.t{animation:appear .7s ease-out 0.49s both}.m{stroke-dasharray:520;animation:draw 1.65s cubic-bezier(.2,.6,.2,1) 0.49s both}.p{animation:softly 1.8s ease-in-out 1.99s 2 both}@media(prefers-reduced-motion:reduce){.t,.m,.p{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}</style><rect width="220" height="292" fill="#F6F5F0"/><g transform="translate(-660 0)"><text class="t" x="22" y="50" fill="#28231D" font-family="Manrope,Arial,sans-serif" font-size="30" font-weight="600">Агентские пайплайны</text><path d="M22 68 H858" stroke="#D4CABD" stroke-width="1"/></g><g transform="translate(0 81)"><g class="t" font-family="Manrope,Arial,sans-serif" fill="#28231D"><text x="18" y="36" font-size="20" font-weight="600">Arch Loop</text></g><g transform="translate(13 48)" class="p"><g class="m" color="#B65A34" stroke="#B65A34" stroke-width="1.8" stroke-opacity=".82" fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="M62 47 Q98 16 136 46 M136 46 L125 39 M136 46 L134 32"/><path d="M148 57 Q163 96 119 114 M119 114 L132 111 M119 114 L125 100"/><path d="M109 117 Q52 116 49 66 M49 66 L57 79 M49 66 L62 68"/><circle cx="65" cy="51" r="7"/><circle cx="140" cy="55" r="7"/><circle cx="117" cy="107" r="7"/><circle cx="51" cy="77" r="6"/></g></g><text x="18" y="195" font-family="Manrope,Arial,sans-serif" font-size="11.8" fill="#6F665B">Ревью → план → правки</text></g></svg>