<style>@keyframes reveal{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@keyframes iconIn{from{opacity:0}to{opacity:.77}}.copy{animation:reveal .6s ease-out .12s both}.art{animation:iconIn .9s ease-out .45s both}@media(prefers-reduced-motion:reduce){.copy,.art{animation:none!important;opacity:1!important;transform:none!important}}</style>
