<svg xmlns="http://www.w3.org/2000/svg" width="280" height="168" viewBox="0 0 280 168" role="img" aria-label="Синусоида">
<title>Синусоида — Жизнь на временной шкале</title>
<style>@keyframes reveal{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@keyframes iconIn{from{opacity:0}to{opacity:.77}}.copy{animation:reveal .6s ease-out .12s both}.art{animation:iconIn .9s ease-out .45s both}@media(prefers-reduced-motion:reduce){.copy,.art{animation:none!important;opacity:1!important;transform:none!important}}</style>
<rect width="280" height="168" fill="#F6F5F0"/><rect x="1" y="1" width="278" height="166" rx="8" fill="none" stroke="#D8CFC3" stroke-width="1"/>
<g class="copy" font-family="Manrope,Arial,sans-serif" fill="#2A2420">
<text x="17" y="34" font-size="18" font-weight="600">Синусоида</text>
<text x="18" y="55" font-size="9.5" letter-spacing=".35" fill="#6E655B">ИНТЕРАКТИВНАЯ ИСТОРИЯ</text>
<path d="M 18 73 H 262" stroke="#D8CFC3" stroke-width=".9"/>
<text x="18" y="119" font-size="12.1" fill="#2A2420">Жизнь на временной шкале</text>
<text x="18" y="150" font-size="10" letter-spacing=".3" fill="#6E655B">ОТКРЫТЬ ↗</text>
</g>
<g class="art" stroke="#B65A34" color="#B65A34" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="M 197 109 C 210 85 216 132 230 110 S 248 86 263 104"/><circle cx="231" cy="110" r="4" fill="currentColor"/></g>
</svg>