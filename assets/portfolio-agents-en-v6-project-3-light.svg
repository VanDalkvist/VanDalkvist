<svg xmlns="http://www.w3.org/2000/svg" width="220" height="270" viewBox="0 0 220 270"><title>Arch Rules — Architecture rules for AI</title><style>@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes trace{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}.txt{animation:appear .65s ease-out both}.art{stroke-dasharray:600;animation:trace 1.65s ease-out .35s both}@media(prefers-reduced-motion:reduce){.txt,.art{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}</style><rect width="220" height="270" fill="#F6F5F0"/><g font-family="Manrope,Arial,sans-serif"><text class="txt" x="26" y="59" font-size="20" font-weight="600" fill="#29231D">Arch Rules</text></g><path d="M184 39 H200 V23 M188 35 L200 23" stroke="#685F54" stroke-opacity=".55" stroke-width="1.05" fill="none"/><g transform="translate(26 112)" stroke="#B65A34" color="#B65A34" stroke-opacity=".67" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><g class="art"><rect x="0" y="0" width="120" height="86" rx="4"/><path d="M15 21 H105 M15 44 H105 M15 67 H105 M16 16 L22 22 L31 9 M16 39 L22 45 L31 32"/></g></g><text x="26" y="246" font-family="Manrope,Arial,sans-serif" font-size="11.4" fill="#685F54">Architecture rules for AI</text></svg>