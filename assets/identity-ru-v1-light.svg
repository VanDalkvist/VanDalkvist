<svg xmlns="http://www.w3.org/2000/svg" width="880" height="172" viewBox="0 0 880 172" role="img" aria-labelledby="heading description"><title id="heading">Привет, я Ваня</title><desc id="description">14 лет я писал код, 5 из них — в Яндексе. Сейчас делаю свои проекты: от цифрового костра для фасилитации встреч до агентского харнесса.</desc>
<style>
@keyframes ink-appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes accent-draw{from{stroke-dashoffset:112}to{stroke-dashoffset:0}}
.headline{animation:ink-appear .8s ease-out both}
.intro{animation:ink-appear .8s ease-out .16s both}
.accent-line{stroke-dasharray:112;animation:accent-draw 1s ease-out .34s both}
@media(prefers-reduced-motion:reduce){.headline,.intro,.accent-line{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
</style>
<rect width="880" height="172" fill="#F6F5F0"/>
<g class="headline" font-family="Manrope,Arial,sans-serif"><text x="24" y="90" font-size="45" font-weight="600" fill="#28231D">Привет, я Ваня</text></g>
<path class="accent-line" d="M 25 109 H 137" stroke="#B65A34" stroke-width="2" stroke-opacity=".56" fill="none" stroke-linecap="round"/>
<path d="M 420 28 V 142" stroke="#D4CABD" stroke-width="1"/>
<g class="intro" font-family="Manrope,Arial,sans-serif" font-size="16.7" font-weight="400" fill="#625A50"><text x="447" y="41">14 лет я писал код, 5 из них — в Яндексе.</text><text x="447" y="71">Сейчас делаю свои проекты:</text><text x="447" y="101">от цифрового костра для фасилитации встреч</text><text x="447" y="131">до агентского харнесса.</text></g>
<path d="M 24 156 H 856" stroke="#D4CABD" stroke-width="1" fill="none"/>
</svg>