<svg xmlns="http://www.w3.org/2000/svg" width="880" height="81" viewBox="0 0 880 81"><title>Игровые механики</title><style>@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}@keyframes softly{0%,100%{opacity:.75}50%{opacity:1}}.t{animation:appear .7s ease-out 0.12s both}.m{stroke-dasharray:520;animation:draw 1.65s cubic-bezier(.2,.6,.2,1) 0.12s both}.p{animation:softly 1.8s ease-in-out 1.62s 2 both}@media(prefers-reduced-motion:reduce){.t,.m,.p{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}</style><rect width="880" height="81" fill="#1E1C1A"/><g class="t"><text x="22" y="50" fill="#ECE4D6" font-family="Manrope,Arial,sans-serif" font-size="30" font-weight="600">Игровые механики</text></g><path d="M22 68 H858" stroke="#453D34" stroke-width="1"/></svg>