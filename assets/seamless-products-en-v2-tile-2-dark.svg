<svg xmlns="http://www.w3.org/2000/svg" width="220" height="292" viewBox="0 0 220 292" role="img" aria-label="Vanya UI"><title>Vanya UI — Shared UI components</title><style>@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}@keyframes softly{0%,100%{opacity:.77}50%{opacity:1}}.t{animation:appear .7s ease-out 0.23s both}.m{stroke-dasharray:520;animation:draw 1.65s cubic-bezier(.2,.6,.2,1) 0.23s both}.p{animation:softly 1.8s ease-in-out 1.73s 2 both}@media(prefers-reduced-motion:reduce){.t,.m,.p{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}</style><rect width="220" height="292" fill="#1E1C1A"/><g transform="translate(-220 0)"><text class="t" x="22" y="50" fill="#ECE4D6" font-family="Manrope,Arial,sans-serif" font-size="30" font-weight="600">Products and interfaces</text><path d="M22 68 H858" stroke="#453D34" stroke-width="1"/></g><g transform="translate(0 81)"><g class="t" font-family="Manrope,Arial,sans-serif" fill="#ECE4D6"><text x="18" y="36" font-size="20" font-weight="600">Vanya UI</text></g><g transform="translate(13 48)" class="p"><g class="m" color="#E5A476" stroke="#E5A476" stroke-width="1.8" stroke-opacity=".82" fill="none" stroke-linejoin="round" stroke-linecap="round"><rect x="37" y="34" width="129" height="83" rx="4"/><path d="M37 52 H166"/><circle cx="49" cy="44" r="3"/><circle cx="59" cy="44" r="3"/><rect x="51" y="70" width="62" height="24" rx="3"/><circle cx="139" cy="83" r="12"/></g></g><text x="18" y="195" font-family="Manrope,Arial,sans-serif" font-size="11.8" fill="#B8AC9F">Shared UI components</text></g></svg>