<svg xmlns="http://www.w3.org/2000/svg" width="220" height="292" viewBox="0 0 220 292" role="img" aria-label="Кожаные мешки"><title>Кожаные мешки — AI-процессы для бизнеса</title><style>@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}@keyframes softly{0%,100%{opacity:.77}50%{opacity:1}}.t{animation:appear .7s ease-out 0.36s both}.m{stroke-dasharray:520;animation:draw 1.65s cubic-bezier(.2,.6,.2,1) 0.36s both}.p{animation:softly 1.8s ease-in-out 1.86s 2 both}@media(prefers-reduced-motion:reduce){.t,.m,.p{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}</style><rect width="220" height="292" fill="#F6F5F0"/><g transform="translate(-440 0)"><text class="t" x="22" y="50" fill="#28231D" font-family="Manrope,Arial,sans-serif" font-size="30" font-weight="600">Продукты и интерфейсы</text><path d="M22 68 H858" stroke="#D4CABD" stroke-width="1"/></g><g transform="translate(0 81)"><g class="t" font-family="Manrope,Arial,sans-serif" fill="#28231D"><text x="18" y="36" font-size="20" font-weight="600">Кожаные мешки</text></g><g transform="translate(13 48)" class="p"><g class="m" color="#B65A34" stroke="#B65A34" stroke-width="1.8" stroke-opacity=".82" fill="none" stroke-linejoin="round" stroke-linecap="round"><rect x="31" y="50" width="35" height="35" rx="4"/><rect x="85" y="50" width="35" height="35" rx="4"/><rect x="139" y="50" width="35" height="35" rx="4"/><path d="M67 68 H84 M78 62 L84 68 L78 74 M121 68 H138 M132 62 L138 68 L132 74"/></g></g><text x="18" y="195" font-family="Manrope,Arial,sans-serif" font-size="11.8" fill="#6F665B">AI-процессы для бизнеса</text></g></svg>