<svg xmlns="http://www.w3.org/2000/svg" width="220" height="350" viewBox="0 0 220 350"><title>Banana Jumper — Jump to earn image tokens</title><style>@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes trace{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}.txt{animation:appear .65s ease-out both}.art{stroke-dasharray:600;animation:trace 1.65s ease-out .35s both}@media(prefers-reduced-motion:reduce){.txt,.art{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}</style><rect width="220" height="350" fill="#F6F5F0"/><g font-family="Manrope,Arial,sans-serif"><g transform="translate(-220 0)"><text x="26" y="65" font-size="31" font-weight="500" fill="#29231D">Game mechanics</text><path d="M26 90 H854" stroke="#D4CABD" stroke-width=".85"/></g><text class="txt" x="26" y="155" font-size="20" font-weight="600" fill="#29231D">Banana Jumper</text></g><g transform="translate(26 204)" stroke="#B65A34" color="#B65A34" stroke-opacity=".67" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"><g class="art"><path d="M0 69 H54 M56 45 H104 M114 19 H155"/><circle cx="77" cy="34" r="6" fill="currentColor"/><path d="M109 63 Q132 77 155 39 Q136 54 109 63"/></g></g><text x="26" y="327" font-family="Manrope,Arial,sans-serif" font-size="11.4" fill="#685F54">Jump to earn image tokens</text></svg>