<svg xmlns="http://www.w3.org/2000/svg" width="440" height="350" viewBox="0 0 440 350" role="img"><title>Game mechanics — scene one</title><style>@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes jump{0%{transform:translate(-150px,22px)}45%{transform:translate(-72px,-56px)}100%{transform:none}}@keyframes scaleX{from{transform:scaleX(.05)}to{transform:scaleX(1)}}.stage{animation:rise .65s ease-out both}.s1{animation-delay:.18s}.s2{animation-delay:.75s}.s3{animation-delay:1.32s}.s4{animation-delay:1.95s}.jumper{animation:jump 1.5s cubic-bezier(.3,.15,.3,1) .55s both}.build-progress{transform-origin:left center;animation:scaleX 1.3s ease-out 1.3s both}@media(prefers-reduced-motion:reduce){.stage,.jumper,.build-progress{animation:none!important;opacity:1!important;transform:none!important}}</style><rect width="440" height="350" fill="#F6F5F0"/><g transform="translate(-440 0)" fill="#29231D" font-family="Manrope,Arial,sans-serif"><text x="26" y="65" font-size="31" font-weight="500">Game mechanics</text><path d="M26 90 H854" stroke="#D4CABD" stroke-width=".85"/></g><g fill="none" stroke="#B65A34" color="#B65A34" stroke-opacity=".63" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><g class="stage s1"><path d="M38 249 H135 M180 207 H268 M318 249 H414"/><path d="M38 249 V270 H135 M180 207 V228 H268 M318 249 V270 H414"/><rect x="55" y="234" width="26" height="15" rx="2"/></g>
